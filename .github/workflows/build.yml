name: Build & Test All Branches

# Trigger on all branches and manual dispatch
on:
  push:
    branches: ["*"]  # All branches
  pull_request:
    branches: ["*"]  # Optional: Add PR support
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            folder: linux
            ext: ''
          - os: windows-latest
            folder: win
            ext: '.exe'
          - os: macos-latest
            folder: macos
            ext: ''

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        python build.py --version ${{ github.run_number }}

    - name: Generate checksum
      run: |
        mkdir -p build/${{ matrix.folder }}
        cd build/${{ matrix.folder }}
        find . -type f -not -name "*.sha256" -exec sha256sum {} + > checksum.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.folder }}-build-${{ github.ref_name }}
        path: |
          build/${{ matrix.folder }}/**
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: build