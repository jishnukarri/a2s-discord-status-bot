name: Build and Release

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            folder: linux
            ext: ''
          - os: windows-latest
            folder: win
            ext: '.exe'
          - os: macos-latest
            folder: macos
            ext: ''

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: python build.py

    - name: Generate checksum
      run: |
        mkdir -p build/${{ matrix.folder }}
        sha256sum ${{ matrix.ext == '.exe' && 'ServerMonitorBot.exe' || 'ServerMonitorBot' }} > build/${{ matrix.folder }}/checksum.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: |
          build/${{ matrix.folder }}/*
          bot_runtime.log
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: build

    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}

    - name: Upload assets
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/${{ matrix.folder }}/*
        asset_name: ServerMonitorBot-${{ matrix.os }}${{ matrix.ext }}
        asset_content_type: application/octet-stream