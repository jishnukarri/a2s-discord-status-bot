# Optional VPN overlay: routes ALL of the bot's network traffic (Discord API,
# A2S server queries, GitHub config fetches) through a WireGuard tunnel.
# Docker only - there is no host/python-level VPN support.
#
# Provide your WireGuard client config as `wireguard.txt` in the repo root
# (standard wg-quick format - [Interface]/[Peer] sections, see
# wireguard.txt.example). It is mounted read-only into the vpn container and
# is gitignored since it contains a private key.
#
# Usage (layer this on top of whichever base compose file you're using):
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up --build
#   docker compose -f docker-compose.container-env.yml -f docker-compose.vpn.yml up --build
#
# The bot container is attached to the vpn container's network namespace
# (network_mode: service:vpn), so it has no network of its own - all traffic
# leaves through wg0 inside the vpn container.
services:
  vpn:
    image: linuxserver/wireguard:latest
    container_name: a2s-bot-vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - ./wireguard.txt:/config/wg_confs/wg0.conf:ro
    restart: unless-stopped

  a2s-bot:
    network_mode: "service:vpn"
    depends_on:
      - vpn
